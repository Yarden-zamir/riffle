on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # kitshn 2 agent keys start a build of one branch (K-718); the dispatch has no inputs.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: riffle-deploy
  cancel-in-progress: false

jobs:
  call:
    uses: Yarden-zamir/kitshn/.github/workflows/kitshn2-deploy.yml@main
    secrets: inherit
